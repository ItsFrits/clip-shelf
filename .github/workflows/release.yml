name: Release

# Push a tag like v0.2.0 and this builds the Windows installer and publishes it
# as a GitHub release. The app updates itself from that release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Check the build output
        shell: bash
        run: |
          ls -la dist
          test -f "dist/clip-shelf-$(node -p "require('./package.json').version")-setup.exe"
          test -f dist/latest.yml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove a half-finished release from an earlier try, the tag stays.
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" \
            dist/*-setup.exe dist/*-setup.exe.blockmap dist/latest.yml \
            --title "Clip Shelf ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
